name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # GitHub secret: service account JSON with Firebase Hosting Admin
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADELMAVENE }}
          projectId: padelmavene
          channelId: live
          force: true
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
